<script type="module">
    import { HOLO_BUILD } from "./HOLO.build.js";
    import { CHIP128 } from "./CHIP128.js";
    import { MANA } from "./MANA.js";
    import { AXES } from "./AXES.js";
    import { CHANNEL } from "./CHANNEL.js";

    function updatePC() {

        const sys = { value: Math.random()*20, flow: 2 };
        const tem = { value: 5, time: 3 };
        const iki = { value: 7, core: 4 };

        const narrativ = Math.floor(Math.random()*5)+1;
        const neutral  = Math.floor(Math.random()*2);

        const holo = HOLO_BUILD(sys, tem, iki, narrativ, neutral);

        const chip = CHIP128(holo.aie.QI, holo.aie.IQQ, holo.aie.MIND);
        const mana = MANA(sys.value, tem.value, narrativ);
        const axes = AXES(holo.sixE, holo.ftg, holo.aie);
        const chan = CHANNEL(holo.ftg, holo.sixE);

        document.getElementById("cpu").innerHTML =
`CPU (HOLO.build)
Hologramm   = ${holo.sixE.hologramm}
Chip-Boost  = ${chip.BOOST}
Mana-Level  = ${mana.LEVEL}
TRANS       = ${chan.TRANS}`;
    }

    setInterval(updatePC, 2000);
</script>
