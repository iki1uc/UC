<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TMP – Systemkern (Mainboard)</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:20px; }
h1, h2 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:10px; margin-bottom:20px; }
.status-green { color:#0f0; }
.status-yellow { color:#ff0; }
.status-red { color:#f00; }
</style>
</head>

<body>

<h1>TMP – Systemkern (Mainboard)</h1>

<pre id="core-status">
Lade Systemkern…
</pre>

<h2>HOLO – 6e‑Bild</h2>
<pre id="holo-output">
Warte auf HOLO.build…
</pre>

<script type="module">
    import { FTG } from "./FTG.js";
    import { TMP } from "./TMP.respo.js";

    // Beispielwerte (du kannst später dynamisch machen)
    const sys = { value: 10, flow: 2 };
    const tem = { value: 5, time: 3 };
    const iki = { value: 7, core: 4 };

    const nuller = 1;   // Neutralität
    const qi = 2;       // Narrativ

    // FTG ausführen
    const result = FTG(sys, tem, iki, nuller, qi);

    // Mainboard‑Status anzeigen
    const core = document.getElementById("core-status");
    core.textContent =
`SYSTEM        = TMP
KONSTELLATION = TMP
FREQ          = ${TMP.freq}
6D            = D2
360°          = aktiv
STATUS        = ZENTRALER KERN
MOVEMENT      = ${result.movement}
ENERGIE       = ${result.energy}
QUALITÄT      = ${result.quality}`;

    // HOLO‑Bild anzeigen
    const holo = document.getElementById("holo-output");
    holo.textContent =
`HOLO.build (6e)
Score       = ${result.sixE.score}
Wetten      = ${result.sixE.wetten}
Narrativ    = ${result.sixE.narrativ}
Neutral     = ${result.sixE.neutral}
Vektor      = ${result.sixE.vektor}
Hologramm   = ${result.sixE.hologramm}
Dimension   = ${result.sixE.dimension}`;
</script>

</body>
</html>
