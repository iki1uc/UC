<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>UC – AMIGA MOVE SCENE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>

<body>
<canvas id="scene" width="900" height="600"></canvas>

<script type="module">
    import { PC } from "./PC.js";
    import { VISIO3 } from "./VISIO3.js";

    const canvas = document.getElementById("scene");

    function loop() {

        const sys = { value: Math.random()*10 };
        const tem = { value: Math.random()*10, time: Math.random()*10 };
        const iki = { core: 4 };
        const narrativ = Math.floor(Math.random()*5)+1;

        const pc = PC(sys, tem, iki, narrativ);

        const CONTINIUM =
            pc.cpu.holo +
            pc.gpu.energy +
            pc.ram.score +
            pc.ram.wetten +
            pc.mana.level +
            pc.chip.BOOST;

        VISIO3(canvas, CONTINIUM, pc.gpu, pc.mana, pc.chip);

        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
