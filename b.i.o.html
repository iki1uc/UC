}
.py-2{

  padding-bottom: 0.5rem;
}
.py-3{
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
}
.pb-10{
  padding-bottom: 2.5rem;
}
.pb-2{
  padding-bottom: 0.5rem;
}
.pt-10{
  padding-top: 2.5rem;
}
.pt-4{
  padding-top: 1rem;
}
.pt-6{
  padding-top: 1.5rem;
}
.text-left{
  text-align: left;
}
.text-right{
  text-align: right;
}
.text-2xl{
  font-size: 1.5rem;

}
.text-3xl{

}
.text-4xl{

}
.text-\[9px\]{

}
.text-xl{
  font-size: 1.25rem;
  line-height: 1.75rem;
}
.font-black{
  font-weight: 900;
}
.font-bold{
  font-weight: 700;
}
.font-medium{
  font-weight: 500;
}
.leading-loose{
  line-height: 2;
}
.leading-none{

}
.leading-relaxed{

}
.tracking-\[0\.25em\]{

.tracking-\[0\.2em\]{

.tracking-\[0\.3em\]{

.tracking-wide{

}
.tracking-wider{
  letter-spacing: 0.05em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--danger\)\]{
  color: var(--danger);
}
.text-\[var\(--faint\)\]{
  color: var(--faint);
}
.text-\[var\(--gold\)\]{
  color: var(--gold);
}
.text-\[var\(--gold-pale\)\]{
  color: var(--gold-pale);
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.text-\[var\(--muted\)\]{
  color: var(--muted);
}
.text-\[var\(--ok\)\]{
  color: var(--ok);
}
.text-black{
  --tw-text-opacity: 1;

}

:root {
  --bg: #0a0805;
  --surface: #14100a;
  --surface-2: #1d170c;
  --line: #3d3115;
  --line-soft: #2a210e;
  --gold: #e6b93d;
  --gold-soft: #b98f2e;
  --gold-pale: #f5d67a;
  --ink: #f0e4c3;
  --muted: #a68f5f;
  --faint: #6f5c33;
  --danger: #e0653a;
  --ok: #a8c686;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #060402;
    --surface: #100c06;
    --surface-2: #171106;
    --line: #33290f;
    --line-soft: #241b09;
    --gold: #eec44a;
    --ink: #f2e7c8;
  }
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
.font-display {
  font-family: 'Archivo', 'IBM Plex Mono', sans-serif;
}
.scan {
  background-image: repeating-linear-gradient(
    0deg,
    rgba(230, 185, 61, 0.025) 0px,
    rgba(230, 185, 61, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
.gridpaper {
  background-image:
    linear-gradient(rgba(230, 185, 61, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(230, 185, 61, 0.05) 1px, transparent 1px);
  background-size: 27px 27px;
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
}
.blink {
  animation: blinkdot 1.1s steps(2, start) infinite;
}
@keyframes risein {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.rise {
  animation: risein 0.45s ease both;
}
::-moz-selection {
  background: var(--gold);
  color: #0a0805;
}
::selection {
  background: var(--gold);
  color: #0a0805;
}
.hover\:border-\[var\(--gold\)\]:hover{
  border-color: var(--gold);
}
.hover\:border-\[var\(--gold-soft\)\]:hover{
  border-color: var(--gold-soft);
}
.hover\:bg-\[var\(--gold\)\]:hover{
  background-color: var(--gold);
}
.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}
.hover\:text-\[var\(--gold\)\]:hover{
  color: var(--gold);
}
.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.disabled\:pointer-events-none:disabled{
  pointer-events: none;
}
.disabled\:opacity-40:disabled{
  opacity: 0.4;
}
@media (min-width: 640px){
  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:p-6{
    padding: 1.5rem;
  }
  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }
}
@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .md\:grid-cols-\[1fr_260px\]{
    grid-template-columns: 1fr 260px;
  }
}
@media (min-width: 1024px){
  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }
  .lg\:grid-cols-5{
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
